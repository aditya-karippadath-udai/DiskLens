[package]
name = "disklens"
version = "0.1.0"
description = "DiskLens - Modern Disk Space Visualizer & Duplicate Finder"
authors = ["DiskLens Team <adityakarippadathudai@gmail.com>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/disklens/disklens"

[build-dependencies]
tauri-build = { version = "2.11", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
sha2 = "0.10"
sysinfo = "0.30"
trash = "3.3"
open = "5.1"
rayon = "1.10"
chrono = { version = "0.4", features = ["serde"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
